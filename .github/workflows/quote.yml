name: Regular close update
on:
  schedule:
    # Evening runs from 18:10 ET (EDT) or 17:10 ET (EST) plus a next-morning catch-up. Each run
    # publishes the latest completed session, so a later run retries a close Yahoo had not yet
    # appended, and a run with nothing newer changes nothing.
    - cron: '10 22,23 * * 1-5'
    - cron: '40 1,3 * * 2-6'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: regular-close-update
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare and publish through candidate checks
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KIND: ${{ github.event_name }}
        run: bash scripts/publish-quote.sh
