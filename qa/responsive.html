<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机显示检查</title><style>body{background:#ddd;font:14px system-ui;margin:20px}header{margin:0 auto 16px;max-width:450px}select,button{font:inherit;padding:8px}button{margin-left:8px}iframe{display:block;margin:auto;border:1px solid #aaa;border-radius:10px;width:390px;height:844px;background:white;max-width:100%}</style></head><body><header><label for="width">屏幕宽度</label> <select id="width"><option value="390">390 px</option><option value="320">320 px</option><option value="430">430 px</option></select><button type="button" id="refresh">刷新预览</button></header><iframe title="美光监控手机预览"></iframe><script>const frame=document.querySelector('iframe');const refresh=()=>{frame.src='../index.html?qa='+Date.now()};document.querySelector('select').addEventListener('change',e=>{frame.style.width=e.target.value+'px'});document.querySelector('#refresh').addEventListener('click',refresh);refresh();</script></body></html>
